unbind C-b
set -g prefix C-x
bind C-x send-prefix
set -g history-limit 102400
setw -g mode-keys vi
set -g escape-time 10

bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

set -g mouse on

unbind-key -T copy-mode-vi v

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "pbcopy"

bind c new-window -c '#{pane_current_path}'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Status bar
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-right "#[bg=#1a1b26,fg=#565f89]#[bg=#565f89,fg=#c0caf5] #(whoami)@#h #[bg=#565f89,fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26,bold] %H:%M "
set -g status-left-length 40
set -g status-right-length 50

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#565f89,fg=#c0caf5,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#565f89,fg=#c0caf5"
set -g message-command-style "bg=#565f89,fg=#c0caf5"

# Pane number display
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"

# Clock mode
set -g clock-mode-colour "#7aa2f7"

# Copy mode
set -g mode-style "bg=#565f89,fg=#c0caf5"
