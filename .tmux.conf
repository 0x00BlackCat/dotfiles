unbind C-b
set -g prefix C-x
bind C-x send-prefix
set -g history-limit 102400
setw -g mode-keys vi
set -g escape-time 10

bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on

unbind-key -T copy-mode-vi v

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "pbcopy"

bind c new-window -c '#{pane_current_path}'

# Status bar
set -g status-style "bg=#081823,fg=#D5D7C0"
set -g status-left "#[bg=#A5DBFF,fg=#081823,bold] #S #[bg=#081823,fg=#A5DBFF]"
set -g status-right "#[bg=#081823,fg=#4F616E]#[bg=#4F616E,fg=#D5D7C0] #(whoami)@#h #[bg=#4F616E,fg=#A5DBFF]#[bg=#A5DBFF,fg=#081823,bold] %H:%M "
set -g status-left-length 40
set -g status-right-length 50

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#4F616E,fg=#D5D7C0,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#4F616E"
set -g pane-active-border-style "fg=#A5DBFF"

# Message style
set -g message-style "bg=#4F616E,fg=#D5D7C0"
set -g message-command-style "bg=#4F616E,fg=#D5D7C0"

# Pane number display
set -g display-panes-active-colour "#A5DBFF"
set -g display-panes-colour "#4F616E"

# Clock mode
set -g clock-mode-colour "#A5DBFF"

# Copy mode
set -g mode-style "bg=#4F616E,fg=#D5D7C0"
